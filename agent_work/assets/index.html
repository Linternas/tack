<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tack · 티켓</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/common.js" defer></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Tack 홈"><span class="brand-symbol">T</span></a>
  </aside>
  <main class="ticket-workspace">
    <header class="ticket-toolbar">
      <h1>티켓</h1>
      <div class="shell-project-picker worktree-toolbar">
        <label for="project-picker">프로젝트</label><select id="project-picker" aria-label="프로젝트 선택"></select>
        <button id="open-worktrees" type="button" class="button secondary" aria-haspopup="dialog">워크트리</button>
      </div>
      <div class="heading-actions"><a class="button quiet" href="/api/export" download>JSON 내보내기</a><button class="button primary" id="add-task">＋ 티켓 추가</button></div>
    </header>
    <div id="connection-error" class="banner error" role="alert" hidden></div>
    <div id="workspace-layout">
      <section id="ticket-list" aria-labelledby="list-title">
        <div class="board-heading"><div><h2 id="list-title">전체 작업</h2><span id="result-count" class="muted"></span></div><div class="view-controls"><button class="text-button" id="reset-filters">필터 초기화</button><button class="button quiet" id="refresh">↻ 새로고침</button></div></div>
        <div class="filters">
          <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="ID, 제목, 내용, 페이지 경로 검색" aria-label="작업 검색" autocomplete="off"><kbd>/</kbd></label>
          <div class="metrics" id="metrics" role="group" aria-label="티켓 상태 필터"></div>
          <select id="record-view" aria-label="기록 보기"><option value="all">미완료 목록</option><option value="everything">전체 목록</option><option value="done">완료 기록</option><option value="archived">보관함</option></select>
          <select id="area-filter" aria-label="영역 필터"><option value="">모든 영역</option></select>
          <select id="priority-filter" aria-label="우선순위 필터"><option value="">모든 우선순위</option><option>P1</option><option>P2</option><option>P3</option></select>
          <label class="api-request-filter"><input id="api-only" type="checkbox">API 요청만</label>
        </div>
        <div class="table-scroll"><table><thead class="ticket-list-columns"><tr><th scope="col">티켓</th><th scope="col">작업</th></tr></thead><tbody id="task-rows"><tr><td colspan="2" class="empty">기록을 불러오는 중입니다.</td></tr></tbody></table></div>
        <footer class="board-footer"><span id="saved-at">SQLite · 연결 중</span></footer>
      </section>
      <section id="detail-panel" class="detail-panel" aria-label="티켓 본문">
        <header id="detail-header" class="panel-top" hidden>
          <button class="button quiet" type="button" id="close-detail"><span aria-hidden="true">←</span> 목록으로</button>
          <div class="detail-id-actions"><span id="detail-id" class="monospace" tabindex="-1"></span><button class="icon-button" type="button" id="copy-detail-id" aria-label="티켓 ID 복사" title="티켓 ID 복사"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2"/></svg></button><span id="copy-detail-status" class="muted" role="status"></span></div>
        </header>
        <p id="detail-empty">목록에서 티켓을 선택하세요.</p>
        <article id="detail-content" tabindex="-1" hidden></article>
      </section>
    </div>
  </main>
  <dialog id="worktree-dialog" aria-labelledby="worktree-title">
    <header class="dialog-header">
      <h2 id="worktree-title">프로젝트 워크트리</h2>
      <form method="dialog"><button type="submit" class="icon-button" aria-label="워크트리 닫기">×</button></form>
    </header>
    <div id="worktree-feedback" class="worktree-feedback" hidden>
      <p id="worktree-message" role="status"></p>
      <ul id="worktree-ignored-paths" aria-label="함께 삭제되는 Git 무시 파일" hidden></ul>
      <div id="worktree-confirmation" class="worktree-actions" hidden>
        <button id="cancel-worktree-remove" type="button" class="button secondary">취소</button>
        <button id="confirm-worktree-remove" type="button" class="button primary">폴더 삭제</button>
      </div>
    </div>
    <div id="worktree-list" class="form-body" aria-live="polite"></div>
  </dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="task-form"><header class="dialog-header"><h2 id="editor-title">항목 추가</h2><button class="icon-button" type="button" id="close-editor" aria-label="편집 닫기">×</button></header>
      <div class="form-body">
        <p id="editor-error" class="banner error" role="alert" hidden></p>
        <label><span>제목 <span class="required">*</span></span><input name="title" required maxlength="200" placeholder="무엇을 확인하거나 처리해야 하나요?"></label>
        <label>페이지 경로<input name="page_path" maxlength="2000" placeholder="예: /ctms/workspaces/[id]/scope1 · 확인한 UI 화면 경로"></label>
        <div class="form-grid"><label>업무 목록<select name="queue" id="edit-queue"></select></label><label>우선순위<select name="priority"><option>P1</option><option selected>P2</option><option>P3</option></select></label><label>담당 구분<input name="owner" placeholder="FE / BE / 기획 / QA"></label></div>
        <label class="api-request-filter"><input name="is_api_request" type="checkbox">API 요청 항목</label>
        <div class="form-grid two"><label>영역<input name="areas" placeholder="공통, Scope 1, 수자원 (쉼표 구분)"></label><label>최근 확인일<input name="last_checked" type="date"></label></div>
        <label>한 줄 배경<textarea name="summary" rows="2" placeholder="현재 무엇이 문제이고 왜 필요한가요?"></textarea></label>
        <label>상세 / API 계약 / 결정할 질문<textarea name="detail" rows="4"></textarea></label>
        <div class="form-grid two"><label>다음 할 일<textarea name="next_action" rows="3"></textarea></label><label>완료·확인 기준<textarea name="acceptance" rows="3"></textarea></label></div>
        <label>상위 작업 ID<input name="parent_id" placeholder="예: LOCAL-0353 · 상위 작업은 하나만 지정"></label>
        <div class="form-grid two"><label>선행 항목 ID<input name="blocked_by" placeholder="API-001, DEC-001"></label><label>확인 근거 종류<input name="verification" placeholder="사용자 보고 / 코드 확인 / 실서버 QA 등"></label></div>
        <label>근거 문서 · 링크 <small>한 줄에 하나: 이름 | 저장소 상대 경로 또는 https URL</small><textarea name="sources" rows="3" placeholder="API 확인 요청 | .vscode/plans/문서.md"></textarea></label>
        <fieldset id="qa-fields"><legend>QA 실행 기록</legend><label>준비 조건<textarea name="qa_preconditions" rows="2"></textarea></label><label>테스트 절차<textarea name="qa_steps" rows="4"></textarea></label><label>기대 결과<textarea name="qa_expected" rows="3"></textarea></label><label>판정<select name="qa_result" id="edit-qa-result"></select></label><label>실제 결과<textarea name="qa_actual" rows="3" placeholder="실행 환경·계정 별칭·관찰한 결과를 기록하세요."></textarea></label><label>증거<textarea name="qa_evidence" rows="2" placeholder="스크린샷 경로·응답 발췌·확인 링크. 토큰·비밀번호는 기록하지 않습니다."></textarea></label></fieldset>
        <label>처리·결정 내용 <small>완료 처리할 때 필수</small><textarea name="resolution" rows="3" placeholder="무엇으로 해결했는지, 누가 어떤 결정을 했는지 기록하세요."></textarea></label>
        <label>이번 변경 메모<textarea name="note" rows="2" placeholder="변경 이력에 함께 저장됩니다."></textarea></label>
      </div><footer class="dialog-footer"><span>저장하면 SQLite와 변경 이력에 반영됩니다.</span><button type="button" class="button secondary" id="cancel-edit">취소</button><button type="submit" class="button primary" id="save-task">저장</button></footer>
    </form>
  </dialog>
  <dialog id="qa-completion" aria-labelledby="qa-completion-title">
    <form id="qa-completion-form"><header class="dialog-header"><div><span class="eyebrow">QA RECORD</span><h2 id="qa-completion-title">QA 완료 처리</h2></div><button class="icon-button" type="button" id="close-qa-completion" aria-label="QA 완료 닫기">×</button></header>
      <div class="form-body">
        <p id="qa-completion-error" class="banner error" role="alert" hidden></p>
        <p id="qa-completion-task" class="prose"></p>
        <p class="muted">직접 확인한 결과를 기록하세요. 저장하면 완료 기록으로 이동합니다.</p>
        <div class="form-grid two"><label>판정<select name="result" required><option value="passed">통과</option><option value="not_applicable">해당 없음</option></select></label><label>확인일<input name="checked_at" type="date" required></label></div>
        <label><span>실제 결과 <span class="required">*</span></span><textarea name="actual" required maxlength="30000" rows="4" placeholder="실행 환경과 확인한 결과를 기록하세요. 해당 없음이면 그 이유를 적어주세요."></textarea></label>
        <label>증거 <small>선택</small><textarea name="evidence" maxlength="30000" rows="2" placeholder="스크린샷 경로·응답 발췌·확인 링크"></textarea></label>
      </div><footer class="dialog-footer"><span>실제 결과와 완료 이력을 함께 저장합니다.</span><button type="button" class="button secondary" id="cancel-qa-completion">취소</button><button type="submit" class="button primary" id="save-qa-completion">완료 저장</button></footer>
    </form>
  </dialog>
  <dialog id="source-dialog" aria-labelledby="source-title"><header class="dialog-header"><h2 id="source-title">근거 문서</h2><button class="icon-button" id="close-source" aria-label="문서 닫기">×</button></header><div id="source-body" aria-busy="false"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
