<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tack · 노트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/common.js" defer></script>
  <script src="/notes.js" defer></script>
</head>
<body>
  <aside class="sidebar"><label class="project-picker">프로젝트<select id="project-picker" aria-label="프로젝트 선택"></select></label></aside>
  <main>
    <header class="topbar"><div class="breadcrumb"><span id="current-project">Tack</span> / 노트</div></header>
    <div class="page">
      <section class="page-heading">
        <div><h1>노트</h1><p>프로젝트의 아이디어와 참고 내용을 기록합니다.</p></div>
        <div class="heading-actions"><button class="button primary" id="add-note">＋ 노트 추가</button></div>
      </section>
      <section class="board notes-board" aria-label="노트 목록">
        <form id="note-search" class="filters">
          <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="note-query" type="search" maxlength="300" aria-label="노트 검색" placeholder="제목과 내용 검색"></label>
          <button class="button secondary" type="submit">검색</button>
        </form>
        <p id="note-status" class="board-footer" role="status"></p>
        <div class="table-scroll"><table><thead><tr><th>제목</th><th>최근 수정</th></tr></thead><tbody id="note-rows"></tbody></table></div>
        <div class="board-footer"><button class="button quiet" id="more-notes" hidden>더 보기</button></div>
      </section>
    </div>
  </main>
  <dialog id="note-editor" aria-labelledby="note-editor-title">
    <form id="note-form">
      <header class="dialog-header"><h2 id="note-editor-title">노트 추가</h2><button class="icon-button" type="button" id="close-note" aria-label="노트 닫기">×</button></header>
      <div class="form-body">
        <p id="note-error" class="banner error" role="alert" hidden></p>
        <label>제목<input name="title" required maxlength="200"></label>
        <label>내용<textarea name="body" required maxlength="30000" rows="12"></textarea></label>
      </div>
      <footer class="dialog-footer"><button class="button primary" type="submit" id="save-note">저장</button></footer>
    </form>
  </dialog>
</body>
</html>
